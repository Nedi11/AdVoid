name: Shield
options:
  bundleIdPrefix: com.roxuh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 4MV3U89JS8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Shield:
    type: application
    platform: iOS
    sources:
      - Shield
      - Shared
    entitlements:
      path: Shield/Shield.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.roxuh.shield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roxuh.shield
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shield
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: SafariExtension
        embed: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Shield Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.roxuh.shield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roxuh.shield.tunnel

  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension/SafariWebExtensionHandler.swift
      - path: SafariExtension/Resources
        buildPhase: resources
      - path: Shared/AppGroup.swift
      - path: Shared/Stats.swift
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.roxuh.shield]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roxuh.shield.safari

  ShieldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ShieldTests
    dependencies:
      - target: Shield
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.roxuh.shield.tests

schemes:
  Shield:
    build:
      targets:
        Shield: all
    test:
      targets:
        - ShieldTests
