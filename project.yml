name: AdVoid
options:
  bundleIdPrefix: com.roxuh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.91.0

settings:
  base:
    DEVELOPMENT_TEAM: 4MV3U89JS8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  AdVoid:
    type: application
    platform: iOS
    sources:
      - AdVoid
      - Shared
    entitlements:
      path: AdVoid/AdVoid.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.roxuh.advoid]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roxuh.advoid
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AdVoid
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - target: PacketTunnel
        embed: true
      - target: SafariExtension
        embed: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: AdVoid Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.roxuh.advoid]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roxuh.advoid.tunnel

  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension/SafariWebExtensionHandler.swift
      - path: SafariExtension/Resources
        buildPhase: resources
      - path: SafariExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/AppGroup.swift
      - path: Shared/Stats.swift
      - path: Shared/Subscription.swift
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: AdVoid
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.roxuh.advoid]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roxuh.advoid.safari

  AdVoidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AdVoidTests
      - path: StoreKit/AdVoid.storekit
        buildPhase: resources
    dependencies:
      - target: AdVoid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.roxuh.advoid.tests

schemes:
  AdVoid:
    build:
      targets:
        AdVoid: all
    run:
      storeKitConfiguration: StoreKit/AdVoid.storekit
    test:
      targets:
        - AdVoidTests
