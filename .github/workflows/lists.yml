name: Publish blocklists

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lists/**", ".github/workflows/lists.yml"]

concurrency:
  group: publish-lists
  cancel-in-progress: false

env:
  BUCKET: advoid-lists
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # The bucket lives in the US jurisdiction, which has its own endpoint.
  AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.us.r2.cloudflarestorage.com
  # R2 doesn't accept the checksum headers newer AWS CLIs send by default.
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the list builder
        run: node --test lists/lib.test.mjs

      - name: Fetch the live catalog
        run: aws s3 cp "s3://$BUCKET/v1/catalog.json" previous-catalog.json || echo "No catalog published yet"

      - name: Build lists
        run: node lists/build.mjs --out dist --previous previous-catalog.json

      - name: Upload list files
        run: |
          aws s3 cp dist/v1/lists "s3://$BUCKET/v1/lists" --recursive \
            --content-type application/octet-stream \
            --cache-control "public, max-age=31536000, immutable"

      # Last, so the catalog never points at a file that isn't uploaded yet.
      - name: Publish catalog
        run: |
          aws s3 cp dist/v1/catalog.json "s3://$BUCKET/v1/catalog.json" \
            --content-type application/json \
            --cache-control "public, max-age=300"

      # Keep yesterday's files too, so phones holding the previous catalog can still download.
      - name: Remove old list files
        run: |
          {
            cat dist/keep.txt
            if [ -f previous-catalog.json ]; then
              node -e 'for (const l of JSON.parse(require("fs").readFileSync("previous-catalog.json")).lists) console.log(l.file.split("/").pop())'
            fi
          } | sort -u > keep-all.txt
          aws s3 ls "s3://$BUCKET/v1/lists/" | awk '{print $4}' | grep '\.bin$' | sort -u > existing.txt || true
          comm -23 existing.txt keep-all.txt | while read -r file; do
            echo "Deleting $file"
            aws s3 rm "s3://$BUCKET/v1/lists/$file"
          done

      - name: Check the published catalog
        run: |
          sleep 5
          curl -fsS "https://lists.roxuh.com/v1/catalog.json" -H "Cache-Control: no-cache" | node -e '
            const c = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const l of c.lists) console.log(`${l.id}: ${l.domainCount} domains, updated ${l.updatedAt}`);'
