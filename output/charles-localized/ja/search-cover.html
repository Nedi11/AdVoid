<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!--
name: Domain stopline · English sample
lane: clean / editorial
hook: a sentence that carries on (Less tracking. More control.)
move: The domain underline
levers: processing fluency (all), curiosity gap (1|2), isolation effect (green emphasis), specificity (real captured domains and lists), peak-end (4), aesthetic-usability (all)
frames:
  1 | Less *tracking.*             | real Home capture; lift real 122 tile | one request trace crosses 1|2
  2 | More *control.*              | real Settings capture; lift actual Essentials row | trace crosses 2|3
  3 | See what gets *blocked.*     | real Activity capture; lift actual blocked domain row | trace crosses 3|4
  4 | Choose your *blocklists.*    | real Settings capture; lift actual HaGeZi row | trace bleeds beyond strip
-->
<title>AdVoid · Domain stopline</title>
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--paper:#f0f1e9;--ink:#14271e;--accent:#246c42;--mint:#ade1af}
body{background:#141a16}.frame{background:transparent}
.hook-ground{background:var(--paper)}.dark-ground{background:var(--ink)}.last-ground{background:var(--paper)}
.hd{font-family:'Inter Tight',sans-serif;font-weight:700;letter-spacing:-.035em;line-height:1.02;color:var(--ink);width:368px;font-size:54px;z-index:3}
.hd.hook{font-size:80px;line-height:.98;letter-spacing:-.045em}
.hd em{font-style:normal;color:var(--accent)}.hd.dark{color:var(--paper)}.hd.dark em{color:var(--mint)}
.brand,.fact,.disclosure{font-family:'Inter Tight',sans-serif;color:var(--ink);font-weight:600;letter-spacing:-.02em;z-index:3}
.brand{font-size:28px}.fact{font-size:16px;line-height:1.25;max-width:368px}.dark{color:var(--paper)}
.disclosure{font-size:16px;font-weight:500;color:#4c5c50;bottom:24px;top:auto!important;width:368px;line-height:1.35}
.disclosure.dark{color:#c6d5c6}
.phone{z-index:1;box-shadow:0 18px 40px -20px #14271e55}
.phone::before{opacity:.75}
.footer-band{height:76px;top:880px;z-index:2}.trace{position:absolute;left:-80px;top:0;width:1920px;height:956px;pointer-events:none;z-index:0}
.crop{z-index:4;background:#fff;box-shadow:0 12px 24px -12px #12281e60;border:1px solid #dce2d9;border-radius:20px}
.crop img{display:block;max-width:none}

.hd,.fact,.disclosure{font-family:"Inter Tight","Noto Sans",sans-serif;letter-spacing:normal;overflow-wrap:normal;direction:ltr} .hd em{color:inherit} .hd.hook em{color:var(--accent)} .hd.dark em{color:var(--mint)}
</style><style>
html{zoom:3}.strip{width:1280px!important;height:853.333333px!important;background:var(--paper)}
.frame{width:1280px!important;height:853.333333px!important}
.frame:not(:first-child),.dark-ground,.last-ground,.footer-band{display:none!important}
.hook-ground{width:1280px!important;height:853.333333px!important}
.brand{left:60px!important;top:60px!important;font-size:42px}
.fact{left:60px!important;top:140px!important;max-width:650px!important;font-size:26px}
.hd.hook{left:60px!important;top:240px!important;width:650px!important;font-size:100px!important;line-height:1.05}
.phone{left:850px!important;top:62px!important}
.crop{left:780px!important;top:620px!important}
.disclosure{left:60px!important;top:745px!important;bottom:auto!important;width:650px!important;font-size:24px}
.trace{top:205px!important;left:-80px!important}
